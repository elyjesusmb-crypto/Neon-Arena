// Utilidades matemáticas pequeñas y sin dependencias.

const TAU = Math.PI * 2;

const clamp = (v, min, max) => (v < min ? min : v > max ? max : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));

function dist2(ax, ay, bx, by) {
  const dx = bx - ax;
  const dy = by - ay;
  return dx * dx + dy * dy;
}

/** Devuelve {x, y, len}: el vector unitario y la longitud original. */
function normalize(x, y) {
  const len = Math.hypot(x, y);
  return len > 1e-6 ? { x: x / len, y: y / len, len } : { x: 0, y: 0, len: 0 };
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** Elimina en el sitio los elementos con .dead === true (sin crear arrays nuevos). */
function removeDead(arr) {
  let w = 0;
  for (let r = 0; r < arr.length; r++) {
    if (!arr[r].dead) arr[w++] = arr[r];
  }
  arr.length = w;
}

return { TAU, clamp, lerp, rand, randInt, dist2, normalize, shuffle, removeDead };

// Ayudas de dibujo reutilizables (solo construyen trazados; quien llama decide fill/stroke).
const { TAU } = __mod["src/core/math.js"];
const alphaCache = new Map();

/** '#rrggbb' + alfa → 'rgba(r,g,b,a)' (con caché, se llama muchas veces por frame). */
function withAlpha(hex, a) {
  const key = hex + a.toFixed(2);
  let out = alphaCache.get(key);
  if (!out) {
    const n = parseInt(hex.slice(1), 16);
    out = `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a.toFixed(2)})`;
    if (alphaCache.size > 4000) alphaCache.clear();
    alphaCache.set(key, out);
  }
  return out;
}

function pathCircle(ctx, x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, Math.max(0, r), 0, TAU);
}

function pathPolygon(ctx, x, y, r, sides, rotation = 0) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rotation + (i / sides) * TAU;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function pathRoundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  if (w <= 0) return;
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

function drawText(ctx, str, x, y, {
  size = 16, weight = 'bold', color = '#fff', align = 'left', baseline = 'top', alpha = 1, glow = null,
  stroke = null, strokeWidth = 0,
} = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${Math.round(size)}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (stroke) {            // contorno grueso estilo "cartoon"
    ctx.lineJoin = 'round';
    ctx.lineWidth = strokeWidth || size * 0.18;
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
  }
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = size * 0.6;
  }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}

/** Texto en varias líneas ajustado a un ancho. Devuelve la altura usada. */
function drawWrapped(ctx, str, x, y, maxW, opts = {}) {
  const size = opts.size ?? 16;
  const lineH = opts.lineHeight ?? size * 1.35;
  ctx.save();
  ctx.font = `${opts.weight ?? 'bold'} ${Math.round(size)}px ${FONT}`;
  const lines = [];
  let line = '';
  for (const word of str.split(' ')) {
    const test = line ? `${line} ${word}` : word;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  ctx.restore();
  lines.forEach((l, i) => drawText(ctx, l, x, y + i * lineH, opts));
  return lines.length * lineH;
}

  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

/** Elimina a todos los enemigos en un círculo (los jefes, cuando existan, solo reciben daño). */
function wipeArea(game, x, y, radius, owner) {
  let killed = 0;
  for (const e of game.enemies) {
    if (e.dead || e.spawning) continue;
    if (dist2(x, y, e.x, e.y) > (radius + e.radius) ** 2) continue;
    const n = normalize(e.x - x, e.y - y);
    e.defused = true;                         // un kamikaze eliminado así no explota
    e.takeDamage(e.def.boss ? 300 : e.hp + 9999, game, n.x, n.y, 400, owner);
    if (e.dead) killed++;
  }
  // JcJ: a los rivales les hace mucho daño (no los elimina de golpe)
  for (const p of game.hostilePlayers(owner)) {
    if (dist2(x, y, p.x, p.y) > (radius + p.radius) ** 2) continue;
    if (p.takeDamage(PVP.abilityDamage, game, x, y, owner) && !p.alive) killed++;

      g.shadowBlur = 30;

  drawDecor(g, w, h, th) {

    }

  /** Lo que se mueve: brillo de la lava, flechas de propulsores, portales y barriles. */
  drawDynamic(ctx, t) {

      ctx.shadowBlur = 14;
      ctx.fillStyle = '#5a1c0c';

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', b.x, b.y + 1);
    }
  }
}

  /** Mando de un invitado local: X cambia a la siguiente habilidad. */
  cycleAbility(slot) {
    const i = ABILITY_IDS.indexOf(slot.ability);
    const id = ABILITY_IDS[(i + 1) % ABILITY_IDS.length];
    slot.ability = id;
    const def = ABILITIES[id];
    this.game.hud.showToast(`Jugador ${this.slots.indexOf(slot) + 1}: ${def.icon} ${def.name}`);
  }

  // ─── Cuadro para escribir el código (HTML: funciona con teclado de móvil) ───
  openJoinDialog() {
    this.openTextDialog({
      title: 'UNIRSE A UNA SALA',
      sub: 'Escribe el código que te ha pasado tu amigo',
      maxLength: 5,
      placeholder: 'CÓDIGO',
      upper: true,
      submitLabel: 'Unirse',
      onSubmit: (code) => {
        this.panel = false;
        this.game.net.join(code);
      },
    });
  }

  openTextDialog({ title, sub, value = '', maxLength = 14, placeholder = '', upper = false, submitLabel = 'Aceptar', onSubmit }) {
    if (this.dialog) return;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,5,25,.6);z-index:10;font-family:system-ui,sans-serif';
    wrap.innerHTML = `
      <form style="background:#16207a;border:3px solid #3dd1ff;border-radius:20px;padding:24px;width:min(88vw,340px);color:#fff;text-align:center">
        <div data-title style="font-weight:900;font-size:22px;margin-bottom:6px"></div>
        <div data-sub style="opacity:.75;font-size:14px;margin-bottom:16px"></div>
        <input autocomplete="off" spellcheck="false"
          style="width:100%;box-sizing:border-box;font-size:${upper ? 32 : 24}px;font-weight:900;letter-spacing:${upper ? 8 : 1}px;text-align:center;${upper ? 'text-transform:uppercase;' : ''}padding:10px;border-radius:12px;border:none;outline:3px solid transparent">
        <div style="display:flex;gap:10px;margin-top:16px">
          <button type="button" data-cancel style="flex:1;min-height:48px;font-size:16px;font-weight:800;border:none;border-radius:12px;background:rgba(255,255,255,.15);color:#fff">Cancelar</button>
          <button type="submit" data-ok style="flex:1;min-height:48px;font-size:16px;font-weight:900;border:none;border-radius:12px;background:#ffc727;color:#2a1a00"></button>
        </div>
      </form>`;
    document.body.appendChild(wrap);
    const form = wrap.querySelector('form');
    const input = wrap.querySelector('input');
    wrap.querySelector('[data-title]').textContent = title;
    wrap.querySelector('[data-sub]').textContent = sub;
    wrap.querySelector('[data-ok]').textContent = submitLabel;
    input.maxLength = maxLength;
    input.placeholder = placeholder;
    input.value = value;
    if (upper) input.setAttribute('autocapitalize', 'characters');
    const close = () => this.closeJoinDialog();
    wrap.querySelector('[data-cancel]').onclick = close;
    wrap.addEventListener('pointerdown', (e) => { if (e.target === wrap) close(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
      e.stopPropagation();
    });
    form.onsubmit = (e) => {
      e.preventDefault();
      const v = input.value;
      close();
      onSubmit(v);
    };
    this.dialog = wrap;
    setTimeout(() => input.focus(), 50);
  }

  closeJoinDialog() {
    this.dialog?.remove();
    this.dialog = null;
  }

  // ─── Entrada ─────────────────────────────────────────────
  update(dt) {
    this.t += dt;
    this.navCd = Math.max(0, this.navCd - dt);
    if (this.dialog) return;
    const inp = this.game.input;
    const hub = inp.gamepads;
    const net = this.game.net;
    const anyPad = (b) => hub.connected().some((i) => hub.justPressed(i, b));

    if (this.abilityPanel) return this.updateAbilityPanel(inp, hub, anyPad);

    // Abrir el menú de habilidades: botón, tecla H o X en el mando del anfitrión
    if (inp.kbm.justPressed(['KeyH'])) this.pickKind = 'ability';
    if (inp.kbm.justPressed(['KeyC'])) this.pickKind = 'character';
    const openAbilities = inp.kbm.justPressed(['KeyH', 'KeyC'])
      || (this.L && inp.clicks.some((c) => inRect(c, this.L.ability)))
      || (this.remote ? anyPad(BTN.X) : (this.slots[0].device.startsWith('gp') && hub.justPressed(Number(this.slots[0].device.slice(2)), BTN.X)))
      || (!this.slots[0].device.startsWith('gp') && !this.remote && this.slots.length === 1 && anyPad(BTN.X));
    if (openAbilities && !this.panel) {
      this.abilityPanel = true;
      this.peek = null;
      return;
    }

    // Mi nombre: tecla N o tocar mi tarjeta
    const myIndex = this.remote ? this.remote.you : 0;
    if (inp.kbm.justPressed(['KeyN']) || (this.L && inp.clicks.some((c) => inRect(c, this.L.cards[myIndex]) && !(this.L.cards[myIndex] && (c.x - this.L.cards[myIndex].close.x) ** 2 + (c.y - this.L.cards[myIndex].close.y) ** 2 < 400)))) {
      this.editName();
      return;
    }

    // Botón ◀ VOLVER (arriba a la izquierda)
    if (this.L && inp.clicks.some((c) => inRect(c, this.L.back))) return this.backToMenu();

    // Invitado online: PREPARADO, elegir habilidad o salir
    if (this.remote) {
      const leave = inp.kbm.justPressed(['Escape', 'Backspace']) || anyPad(BTN.B)
        || inp.clicks.some((c) => this.L && inRect(c, this.L.invite));
      if (leave) return net.leave();
      const ready = inp.kbm.justPressed(['Enter', 'Space', 'KeyR']) || anyPad(BTN.A) || anyPad(BTN.START)
        || inp.clicks.some((c) => this.L && inRect(c, this.L.play));
      if (ready) this.toggleReady();
      return;
    }

    if (this.panel) return this.updatePanel(inp, anyPad);

    // Modo / mapa / bots: M y K (Mayús = anterior), B añade un bot.
    // Mando del anfitrión: LB / RB = modo · cruceta ← → = mapa · cruceta ↑ = añadir bot, ↓ = quitar bot
    const back = inp.kbm.any(['ShiftLeft', 'ShiftRight']);
    if (inp.kbm.justPressed(['KeyM'])) this.cycleMode(back ? -1 : 1);
    if (inp.kbm.justPressed(['KeyK'])) this.cycleMap(back ? -1 : 1);
    if (inp.kbm.justPressed(['KeyB'])) this.addBot();
    const hostPad = this.slots[0].device.startsWith('gp') ? Number(this.slots[0].device.slice(2)) : null;
    if (hostPad !== null) {
      if (hub.justPressed(hostPad, BTN.RB)) this.cycleMode(1);
      if (hub.justPressed(hostPad, BTN.LB)) this.cycleMode(-1);
      if (hub.justPressed(hostPad, BTN.RIGHT)) this.cycleMap(1);
      if (hub.justPressed(hostPad, BTN.LEFT)) this.cycleMap(-1);
      if (hub.justPressed(hostPad, BTN.UP)) this.addBot();
      if (hub.justPressed(hostPad, BTN.DOWN)) {
        const bot = [...this.slots].reverse().find((sl) => sl.bot);
        if (bot) this.leave(bot);
      }
    }

    // Mandos: A = unirse (o jugar si eres el anfitrión), B = salir, Y = invitar, START = jugar
    for (const i of hub.connected()) {
      const id = `gp${i}`;
      const slot = this.slotOf(id);
      if (hub.justPressed(i, BTN.A)) {
        if (!slot) this.join(id);
        else if (slot.host) return this.start();
      }
      if (slot && hub.justPressed(i, BTN.START)) return this.start();
      if (slot && slot.host && hub.justPressed(i, BTN.Y)) this.panel = true;
      if (slot && !slot.host && hub.justPressed(i, BTN.X)) this.cycleAbility(slot);
      if (slot && !slot.host && hub.justPressed(i, BTN.Y)) this.cycleCharacter(slot);
      if (slot && !slot.host && hub.justPressed(i, BTN.B)) this.leave(slot);
    }

    // Teclado: ENTER/ESPACIO = unirse (o jugar si es el anfitrión), I = invitar, ESC = salir
    const kslot = this.slotOf('kbm');
    if (inp.kbm.justPressed(['Enter', 'Space'])) {
      if (!kslot) this.join('kbm');
      else if (kslot.host) return this.start();
    }
    if (inp.kbm.justPressed(['KeyI'])) this.panel = true;
    if (kslot && !kslot.host && inp.kbm.justPressed(['Escape', 'Backspace'])) this.leave(kslot);
    // El anfitrión vuelve al menú: ESC / RETROCESO (teclado) o B en su mando
    if ((!kslot || kslot.host) && inp.kbm.justPressed(['Escape', 'Backspace'])) return this.backToMenu();
    const hp = this.slots[0].device.startsWith('gp') ? Number(this.slots[0].device.slice(2)) : null;
    if (hp !== null && hub.justPressed(hp, BTN.B)) return this.backToMenu();

    // Clics y toques
    const L = this.L;
    if (!L) return;
    for (const c of inp.clicks) {
      if (inRect(c, L.mode)) return this.cycleMode(c.x > L.mode.x + L.mode.w * 0.8 ? 1 : c.x < L.mode.x + L.mode.w * 0.2 ? -1 : 1);
      if (inRect(c, L.map)) return this.cycleMap(c.x < L.map.x + L.map.w * 0.2 ? -1 : 1);
      if (inRect(c, L.play)) return this.start();
      if (inRect(c, L.invite)) {
        this.panel = true;
        return;
      }
      for (let i = 0; i < L.cards.length; i++) {
        const slot = this.slots[i];
        const r = L.cards[i];
        if (slot && !slot.host && (c.x - r.close.x) ** 2 + (c.y - r.close.y) ** 2 < (r.close.r * 1.4) ** 2) {
          this.leave(slot);
          return;
        }
        if (!slot && inRect(c, r)) {
          if (c.y > r.y + r.h - 54 * (r.s || 1)) this.addBot();   // botón "+ BOT" del hueco libre
          else this.panel = true;
          return;
        }
      }
    }
  }

  updateAbilityPanel(inp, hub, anyPad) {
    const P = this.AP;
    const C = this.pickCfg();
    const cols = P ? P.cols : 3;
    const cur = Math.max(0, C.ids.indexOf(this.pickKind === 'character' && this.peek ? this.peek : this.mySlot?.[C.field]));
    const n = C.ids.length;
    let move = 0;
    // Cambiar de pestaña: TAB / Q / E, LB / RB, o tocando la pestaña
    const swapTab = () => { this.pickKind = this.pickKind === 'character' ? 'ability' : 'character'; Sound.play('ui'); };
    if (inp.kbm.justPressed(['Tab', 'KeyQ', 'KeyE'])) return swapTab();
    if (anyPad(BTN.LB) || anyPad(BTN.RB)) return swapTab();

    // Teclado: flechas / WASD
    const k = inp.kbm;
    if (k.justPressed(['ArrowRight', 'KeyD'])) move = 1;
    if (k.justPressed(['ArrowLeft', 'KeyA'])) move = -1;
    if (k.justPressed(['ArrowDown', 'KeyS'])) move = cols;
    if (k.justPressed(['ArrowUp', 'KeyW'])) move = -cols;
    // Mando: cruceta o stick
    for (const i of hub.connected()) {
      if (hub.justPressed(i, BTN.RIGHT)) move = 1;
      if (hub.justPressed(i, BTN.LEFT)) move = -1;
      if (hub.justPressed(i, BTN.DOWN)) move = cols;
      if (hub.justPressed(i, BTN.UP)) move = -cols;
      const [ax, ay] = hub.axes(i);
      if (this.navCd <= 0 && Math.hypot(ax, ay) > 0.6) {
        move = Math.abs(ax) > Math.abs(ay) ? Math.sign(ax) : Math.sign(ay) * cols;
        this.navCd = 0.22;
      }
    }
    if (move) C.equip(C.ids[(cur + move + n * 4) % n]);

    for (const c of inp.clicks) {
      if (!P) break;
      const tab = P.tabs.findIndex((r) => inRect(c, r));
      if (tab >= 0) {
        const kind = tab === 0 ? 'character' : 'ability';
        if (kind !== this.pickKind) swapTab();
        return;
      }
      const hit = P.tiles.findIndex((r) => inRect(c, r));
      if (hit >= 0) {
        C.equip(C.ids[hit]);
        return;
      }
      if (inRect(c, P.ok) || !inRect(c, P.box)) {
        this.abilityPanel = false;
        return;
      }
    }
    if (k.justPressed(['Escape', 'Enter', 'Space', 'KeyH', 'KeyC']) || anyPad(BTN.A) || anyPad(BTN.B) || anyPad(BTN.X)) {
      this.abilityPanel = false;
    }
  }

  updatePanel(inp, anyPad) {
    const net = this.game.net;
    const avail = net.availability.ok;
    const P = this.P;
    const create = () => { if (avail && !net.active) net.host(); };
    const join = () => { if (avail && !net.active) this.openJoinDialog(); };

    for (const c of inp.clicks) {
      if (!P) break;
      if (P.create && inRect(c, P.create)) return create();
      if (P.join && inRect(c, P.join)) return join();
      if (P.closeRoom && inRect(c, P.closeRoom)) return net.leave();
      if (P.share && inRect(c, P.share)) return net.share();
      if (P.whatsapp && inRect(c, P.whatsapp)) return net.whatsapp();
      if (P.copy && inRect(c, P.copy)) return net.copyInvite();
      if (!inRect(c, P.box) || (P.ok && inRect(c, P.ok))) {
        this.panel = false;
        return;
      }
    }
    if (inp.kbm.justPressed(['KeyC']) || anyPad(BTN.X)) return create();
    if (inp.kbm.justPressed(['KeyU'])) return join();
    if (inp.kbm.justPressed(['Escape', 'Enter', 'Space', 'Backspace', 'KeyI']) || anyPad(BTN.A) || anyPad(BTN.B) || anyPad(BTN.Y)) {
      this.panel = false;
    }
  }

  // ─── Distribución (se adapta a PC, móvil vertical y horizontal) ─────
  layout(w, h, s) {
    const portrait = h > w * 1.1;
    const cols = portrait ? 2 : 4;
    const rows = portrait ? 2 : 1;
    const pad = 16 * s;
    const top = (w < 600 ? 120 : 92) * s + 50 * s;
    const btnH = 62 * s;
    const btnY = h - pad - btnH;
    const hintH = 50 * s;
    const areaH = btnY - top - hintH - 8 * s;
    const gap = 14 * s;
    const maxW = Math.min(w - pad * 2, 1040 * s);
    let cw = (maxW - gap * (cols - 1)) / cols;
    const ch = Math.min((areaH - gap * (rows - 1)) / rows, cw * 1.4, 300 * s);
    cw = Math.min(cw, ch * 0.88);
    const totalW = cw * cols + gap * (cols - 1);
    const totalH = ch * rows + gap * (rows - 1);
    const x0 = (w - totalW) / 2;
    const y0 = top + (areaH - totalH) / 2;
    const cards = [];
    for (let i = 0; i < MAX_PARTY; i++) {
      const cx = x0 + (i % cols) * (cw + gap);
      const cy = y0 + Math.floor(i / cols) * (ch + gap);
      cards.push({ x: cx, y: cy, w: cw, h: ch, s, close: { x: cx + cw - 16 * s, y: cy + 16 * s, r: 12 * s } });
    }
    const bw = Math.min(240 * s, (w - pad * 4) / 3);
    const selW = Math.min(300 * s, (w - pad * 3) / 2);
    const selY = top - 50 * s;
    return {
      cards,
      back: { x: 14 * s, y: 12 * s, w: 120 * s, h: 38 * s },
      mode: { x: w / 2 - selW - pad / 2, y: selY, w: selW, h: 40 * s },
      map: { x: w / 2 + pad / 2, y: selY, w: selW, h: 40 * s },
      hintY: btnY - 34 * s,
      play: { x: w - pad - bw, y: btnY, w: bw, h: btnH },
      ability: { x: (w - bw) / 2, y: btnY, w: bw, h: btnH },
      invite: { x: pad, y: btnY, w: bw, h: btnH },
    };
  }

  // ─── Dibujo ─────────────────────────────────────────────
  draw(ctx, w, h, s) {
    const L = (this.L = this.layout(w, h, s));
    const net = this.game.net;
    const slots = this.view;
    this.drawBackground(ctx, w, h);

    // Barra superior
    const narrow = w < 600;
    this.drawButton(ctx, L.back, '◀ VOLVER', '#9aa3c7', '#5b6390', '#1b1f3a', s, 1, 15);
    const titleY = narrow ? 62 * s : 26 * s;
    const online = slots.filter((sl) => sl.device === 'net' || sl.device.startsWith('net:')).length;
    const lostN = slots.filter((sl, i) => this.slotStatus(sl, i).lost).length;
    drawText(ctx, `SALA DE AMIGOS  ${slots.length}/${MAX_PARTY}${online ? `  ·  🟢 ${online - lostN} online` : ''}`, w / 2, titleY, {
      size: 17 * s, weight: '900', align: 'center', stroke: '#0b0e3a', strokeWidth: 5 * s,
    });
    this.drawPill(ctx, `🏆 ${PROGRESS.trophies}`, w - 18 * s, 18 * s, s);
    const code = this.remote?.code ?? (net.isHost ? net.code : null);
    if (code) {
      drawText(ctx, `🌐 ONLINE · CÓDIGO ${code}`, w / 2, titleY + 28 * s, {
        size: 15 * s, weight: '900', align: 'center', color: '#ffd23d', stroke: '#0b0e3a', strokeWidth: 5 * s,
      });
    }

    this.drawSelector(ctx, L.mode, 'MODO', this.viewMode, s, !this.remote);
    this.drawSelector(ctx, L.map, 'MAPA', this.viewMap, s, !this.remote);

    L.cards.forEach((r, i) => (slots[i]
      ? this.drawPlayerCard(ctx, r, slots[i], i, s, this.remote && this.remote.you === i)
      : this.drawEmptyCard(ctx, r, s)));

    drawText(ctx, this.hintText(w), w / 2, L.hintY, { size: 13 * s, align: 'center', baseline: 'middle', weight: '600', alpha: 0.8 });

    const myDef = ABILITIES[this.mySlot?.ability] ?? ABILITIES[DEFAULT_ABILITY];
    const myChar = CHARACTERS[this.mySlot?.character] ?? CHARACTERS[DEFAULT_CHARACTER];
    this.drawButton(ctx, L.ability, `${myChar.icon} ${myChar.name.toUpperCase()} · ${myDef.icon}`, '#c79bff', '#7a4fc0', '#21093f', s, 1);
    drawText(ctx, 'PERSONAJE Y HABILIDAD', L.ability.x + L.ability.w / 2, L.ability.y - 10 * s, { size: 11 * s, weight: '900', align: 'center', baseline: 'middle', alpha: 0.8 });

    if (this.remote) {
      const ready = this.mySlot?.ready;
      this.drawButton(ctx, L.invite, 'SALIR', '#ff6b8a', '#a8304b', '#3a0612', s, 1);
      if (ready) this.drawButton(ctx, L.play, '✔ PREPARADO', '#3dff9a', '#1f9a5a', '#06311a', s, 1, 20);
      else this.drawButton(ctx, L.play, 'PREPARADO', '#ffc727', '#b8860b', '#2a1a00', s, 1 + 0.03 * Math.sin(this.t * 5), 20);
    } else {
      this.drawButton(ctx, L.invite, '👥 INVITAR', '#3dd1ff', '#1b7fa8', '#06263a', s, 1);
      const waiting = this.notReady.length;
      if (waiting) {
        const total = this.slots.filter((sl) => sl.device.startsWith('net:')).length;
        this.drawButton(ctx, L.play, `ESPERANDO ${total - waiting}/${total}`, '#9aa3c7', '#5b6390', '#1b1f3a', s, 1, 18);
      } else {
        this.drawButton(ctx, L.play, 'JUGAR', '#ffc727', '#b8860b', '#2a1a00', s, 1 + 0.03 * Math.sin(this.t * 5));
      }
    }

    if (this.game.input.gamepads.blocked) {
      drawText(ctx, '🎮 Esta vista no permite mandos: usa el archivo descargado NeonArena.html', w / 2, titleY + 52 * s, {
        size: 12 * s, align: 'center', color: '#ffd23d', weight: '700',
      });
    }
    if (this.panel) this.drawPanel(ctx, w, h, s);
    if (this.abilityPanel) this.drawAbilityPanel(ctx, w, h, s);
  }

  drawSelector(ctx, r, label, item, s, editable) {
    ctx.fillStyle = 'rgba(10,14,60,0.85)';
    pathRoundRect(ctx, r.x, r.y, r.w, r.h, r.h / 2);
    ctx.fill();
    ctx.lineWidth = 2 * s;
    ctx.strokeStyle = editable ? 'rgba(61,209,255,0.8)' : 'rgba(255,255,255,0.25)';
    ctx.stroke();
    drawText(ctx, label, r.x + r.w / 2, r.y - 1 * s, { size: 9 * s, weight: '900', align: 'center', baseline: 'bottom', alpha: 0.65 });
    const text = `${item.icon} ${item.name}`;
    ctx.font = `900 ${Math.round(15 * s)}px ${FONT}`;
    const tw = ctx.measureText(text).width;
    const maxW = r.w - (editable ? 56 : 20) * s;
    drawText(ctx, text, r.x + r.w / 2, r.y + r.h / 2 + 1, { size: tw > maxW ? 15 * s * maxW / tw : 15 * s, weight: '900', align: 'center', baseline: 'middle' });
    if (editable) {
      drawText(ctx, '‹', r.x + 16 * s, r.y + r.h / 2, { size: 22 * s, weight: '900', align: 'center', baseline: 'middle', color: '#3dd1ff' });
      drawText(ctx, '›', r.x + r.w - 16 * s, r.y + r.h / 2, { size: 22 * s, weight: '900', align: 'center', baseline: 'middle', color: '#3dd1ff' });
    }
  }

  hintText(w) {
    const narrow = w < 720;
    if (this.remote) return narrow ? 'Esperando al anfitrión · C: personaje · ESC: salir' : 'Esperando a que el anfitrión pulse JUGAR  ·  C: personaje · H / X: habilidad  ·  B / ESC: salir';
    const host = this.slots[0]?.device ?? 'kbm';
    if (host.startsWith('gp')) {
      return narrow ? 'A: jugar · LB/RB: modo · ←→: mapa · ↑: bot' : 'A: jugar · B: volver · X: personaje y habilidad · Y: invitar · LB/RB: modo · ←→: mapa · ↑/↓: añadir/quitar bot';
    }
    if (host === 'touch') return 'Toca MODO o MAPA para cambiarlos · "+ BOT" en un hueco libre';
    return narrow ? 'ESPACIO: jugar · M: modo · K: mapa · B: bot' : 'ESPACIO: jugar · ESC: volver · C: personaje · H: habilidad · I: invitar · M: modo · K: mapa · B: añadir bot · Mandos extra: A unirse';
  }

  drawBackground(ctx, w, h) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#2b3dff');
    g.addColorStop(0.55, '#1a1f8f');
    g.addColorStop(1, '#0b0e3a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(w / 2, h * 0.45);
    ctx.rotate(this.t * 0.06);
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    const R = Math.hypot(w, h);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a, a + 0.22);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    const f = ctx.createLinearGradient(0, h * 0.7, 0, h);
    f.addColorStop(0, 'rgba(5,8,40,0)');
    f.addColorStop(1, 'rgba(5,8,40,0.75)');
    ctx.fillStyle = f;
    ctx.fillRect(0, h * 0.7, w, h * 0.3);
  }

  drawPill(ctx, text, right, y, s) {
    ctx.font = `800 ${Math.round(15 * s)}px ${FONT}`;
    const tw = ctx.measureText(text).width + 24 * s;
    const ph = 30 * s;
    ctx.fillStyle = 'rgba(5,8,40,0.55)';
    pathRoundRect(ctx, right - tw, y, tw, ph, ph / 2);
    ctx.fill();
    drawText(ctx, text, right - tw / 2, y + ph / 2, { size: 15 * s, weight: '800', align: 'center', baseline: 'middle', color: '#ffd23d' });
  }

  drawPlayerCard(ctx, r, slot, i, s, isYou) {
    const color = this.slotColor(i);
    const k = easeOutBack(clamp((this.t - slot.joinedAt) / 0.35, 0, 1));

    ctx.fillStyle = 'rgba(3,5,30,0.55)';
    pathRoundRect(ctx, r.x, r.y + 6 * s, r.w, r.h, 18 * s);
    ctx.fill();
    const cg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    cg.addColorStop(0, withAlpha(color, 0.35));
    cg.addColorStop(1, 'rgba(10,14,60,0.85)');
    ctx.fillStyle = cg;
    pathRoundRect(ctx, r.x, r.y, r.w, r.h, 18 * s);
    ctx.fill();
    ctx.lineWidth = (isYou ? 5 : 3) * s;
    ctx.strokeStyle = isYou ? '#ffffff' : color;
    ctx.stroke();

    // Nombre (ajustado al ancho) + "Jugador N"
    const name = this.nameOf(slot, i).toUpperCase();
    ctx.font = `900 ${Math.round(16 * s)}px ${FONT}`;
    const nw = ctx.measureText(name).width;
    const ns = nw > r.w - 34 * s ? (16 * s * (r.w - 34 * s)) / nw : 16 * s;
    drawText(ctx, name, r.x + r.w / 2, r.y + 14 * s, { size: ns, weight: '900', align: 'center', stroke: '#0b0e3a', strokeWidth: 5 * s });
    const mine = isYou || (!this.remote && i === 0);
    const team = this.viewMode.teams ? ` · ${TEAM_NAMES[i % 2]}` : '';
    const sub = (slot.host ? '★ ANFITRIÓN' : slot.device.startsWith('bot') ? 'BOT' : `JUGADOR ${i + 1}`) + team;
    drawText(ctx, mine ? `${sub} · ✏️` : sub, r.x + r.w / 2, r.y + 36 * s, { size: 11 * s, weight: '800', align: 'center', color: slot.host ? '#ffd23d' : '#ffffff', alpha: slot.host ? 1 : 0.7 });

    // Estado online: conexión (ping) y PREPARADO
    const st = this.slotStatus(slot, i);
    if (st.online) {
      const dot = st.lost ? '#ffb02e' : st.ping == null ? '#9aa3c7' : st.ping < 90 ? '#3dff9a' : st.ping < 180 ? '#ffd23d' : '#ff4d6d';
      ctx.fillStyle = dot;
      pathCircle(ctx, r.x + 16 * s, r.y + 16 * s, 5 * s);
      ctx.fill();
      drawText(ctx, st.lost ? 'reconectando…' : st.ping == null ? '' : `${st.ping} ms`, r.x + 26 * s, r.y + 16 * s, { size: 10 * s, weight: '700', baseline: 'middle', alpha: 0.85 });
    }
    if (st.online || this.remote) {
      const ok = slot.ready || slot.host;
      const tag = slot.host ? '' : ok ? '✔ PREPARADO' : '⏳ NO PREPARADO';
      if (tag) drawText(ctx, tag, r.x + r.w / 2, r.y + 54 * s, { size: 11 * s, weight: '900', align: 'center', color: ok ? '#3dff9a' : '#ffb02e' });
    }

    const cx = r.x + r.w / 2;
    const py = r.y + r.h * 0.7;
    const pr = Math.min(r.w * 0.36, r.h * 0.2);
    ctx.fillStyle = withAlpha(color, 0.3);
    ctx.beginPath();
    ctx.ellipse(cx, py, pr * 1.35, pr * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 2 * s;
    ctx.strokeStyle = withAlpha(color, 0.8);
    ctx.stroke();

    const bob = Math.sin(this.t * 3 + i) * 4 * s;
    const ar = pr * 0.72 * k;
    const chd = CHARACTERS[slot.character] ?? CHARACTERS[DEFAULT_CHARACTER];
    if (ar > 0.5 && AURAS[slot.aura]) drawAura(ctx, cx, py - pr * 0.95 + bob, ar, AURAS[slot.aura], this.t);
    if (ar > 0.5) drawAvatar(ctx, cx, py - pr * 0.95 + bob, ar, color, Math.sin(this.t * 1.5 + i) * 0.8 - 0.3, { shape: chd.shape, accent: chd.accent });

    drawText(ctx, deviceLabel(slot.device, isYou), cx, r.y + r.h - 18 * s, { size: 12 * s, weight: '700', align: 'center', baseline: 'middle', alpha: 0.85 });
    const ad = ABILITIES[slot.ability];
    if (ad) {
      ctx.font = `800 ${Math.round(12 * s)}px ${FONT}`;
      const label = `${chd.icon} ${chd.name} · ${ad.icon} ${ad.name}`;
      const tw = Math.min(r.w - 12 * s, ctx.measureText(label).width + 18 * s);
      const by = r.y + r.h - 46 * s;
      ctx.fillStyle = withAlpha(ad.color, 0.25);
      pathRoundRect(ctx, cx - tw / 2, by - 11 * s, tw, 22 * s, 11 * s);
      ctx.fill();
      ctx.lineWidth = 1.5 * s;
      ctx.strokeStyle = ad.color;
      ctx.stroke();
      const lw = ctx.measureText(label).width;
      const fs = lw > tw - 12 * s ? 12 * s * (tw - 12 * s) / lw : 12 * s;
      drawText(ctx, label, cx, by, { size: fs, weight: '800', align: 'center', baseline: 'middle' });
    }

    if (!slot.host && !this.remote) {
      const c = r.close;
      ctx.fillStyle = 'rgba(255,77,109,0.9)';
      pathCircle(ctx, c.x, c.y, c.r);
      ctx.fill();
      drawText(ctx, '✕', c.x, c.y + 1, { size: 13 * s, weight: '900', align: 'center', baseline: 'middle' });
    }
  }

  /** ¿Es online?, ¿se está reconectando?, ¿qué ping tiene? (desde mi punto de vista) */
  slotStatus(slot, i) {
    if (this.remote) {
      const online = i === 0 || slot.device === 'net';
      const ping = i === 0 || i === this.remote.you ? this.game.net.rtt : slot.ping;
      return { online, lost: slot.lost, ping };
    }
    if (!slot.device.startsWith('net:')) return { online: false };
    const peer = this.game.net.peers.get(slot.device.slice(4));
    return { online: true, lost: !!peer?.lostAt, ping: peer?.ping ?? null };
  }

  drawEmptyCard(ctx, r, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    pathRoundRect(ctx, r.x, r.y, r.w, r.h, 18 * s);
    ctx.fill();
    ctx.setLineDash([10 * s, 8 * s]);
    ctx.lineWidth = 2.5 * s;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.stroke();
    ctx.setLineDash([]);

    const cx = r.x + r.w / 2;
    const cy = r.y + r.h * 0.45;
    const pr = Math.min(r.w, r.h) * 0.18 * (1 + 0.05 * Math.sin(this.t * 4));
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    pathCircle(ctx, cx, cy, pr);
    ctx.fill();
    drawText(ctx, '+', cx, cy + 2 * s, { size: pr * 1.4, weight: '900', align: 'center', baseline: 'middle', alpha: 0.85 });
    if (this.remote) {
      drawText(ctx, 'LIBRE', cx, cy + pr + 22 * s, { size: 15 * s, weight: '900', align: 'center', baseline: 'middle', alpha: 0.6 });
      return;
    }
    drawText(ctx, 'INVITAR', cx, cy + pr + 22 * s, { size: 15 * s, weight: '900', align: 'center', baseline: 'middle', alpha: 0.85 });
    drawText(ctx, 'Online o mando', cx, cy + pr + 42 * s, { size: 11 * s, weight: '600', align: 'center', baseline: 'middle', alpha: 0.55 });
    // Botón "+ BOT" (parte baja del hueco)
    const bw = Math.min(r.w - 20 * s, 120 * s);
    const by = r.y + r.h - 44 * s;
    ctx.fillStyle = 'rgba(199,155,255,0.22)';
    pathRoundRect(ctx, cx - bw / 2, by, bw, 32 * s, 16 * s);
    ctx.fill();
    ctx.lineWidth = 2 * s;
    ctx.strokeStyle = '#c79bff';

    drawText(ctx, '🤖 + BOT', cx, by + 16 * s, { size: 13 * s, weight: '900', align: 'center', baseline: 'middle' });
  }

  drawButton(ctx, r, label, face, shadow, ink, s, scale, size = 24) {
    ctx.save();
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
    ctx.scale(scale, scale);
    const x = -r.w / 2;
    const y = -r.h / 2;
    const rad = 16 * s;
    ctx.fillStyle = shadow;
    pathRoundRect(ctx, x, y + 6 * s, r.w, r.h, rad);
    ctx.fill();
    ctx.fillStyle = face;
    pathRoundRect(ctx, x, y, r.w, r.h, rad);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    pathRoundRect(ctx, x + 6 * s, y + 5 * s, r.w - 12 * s, r.h * 0.32, rad * 0.6);
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = ink;
    pathRoundRect(ctx, x, y, r.w, r.h, rad);
    ctx.stroke();
    ctx.restore();
    // Ajusta el tamaño del texto para que quepa en el botón
    let fs = size * s;
    ctx.font = `900 ${Math.round(fs)}px ${FONT}`;
    const tw = ctx.measureText(label).width;
    if (tw > r.w - 16 * s) fs *= (r.w - 16 * s) / tw;
    drawText(ctx, label, r.x + r.w / 2, r.y + r.h / 2 + 1, { size: fs, weight: '900', align: 'center', baseline: 'middle', color: ink });
  }

  /** Panel "Elige tu habilidad": pulsar una casilla la EQUIPA y muestra su descripción. */
  drawAbilityPanel(ctx, w, h, s) {
    ctx.fillStyle = 'rgba(3,5,25,0.75)';
    ctx.fillRect(0, 0, w, h);
    const C = this.pickCfg();
    const isChar = this.pickKind === 'character';
    const portrait = h > w * 1.1;
    const cols = isChar ? (portrait ? 3 : 6) : portrait ? 2 : 3;
    const rows = Math.ceil(C.ids.length / cols);

    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = isChar ? '#3dd1ff' : '#c79bff';
    ctx.stroke();

    // Pestañas
    const tabs = [];
    const tabW = Math.min(200 * s, (pw - 40 * s) / 2);
    ['🦸 PERSONAJE', '✨ HABILIDAD'].forEach((label, i) => {
      const r = { x: w / 2 - tabW - 4 * s + i * (tabW + 8 * s), y: y + 12 * s, w: tabW, h: 36 * s };
      tabs.push(r);
      const on = (i === 0) === isChar;
      ctx.fillStyle = on ? (i === 0 ? '#3dd1ff' : '#c79bff') : 'rgba(255,255,255,0.08)';
      pathRoundRect(ctx, r.x, r.y, r.w, r.h, 18 * s);
      ctx.fill();
      drawText(ctx, label, r.x + r.w / 2, r.y + r.h / 2 + 1, { size: 15 * s, weight: '900', align: 'center', baseline: 'middle', color: on ? '#0b0e3a' : '#ffffff' });
    });
    const slot = this.mySlot;
    const equipped = slot?.[C.field] ?? C.def;
    const current = isChar && this.peek ? this.peek : equipped;
    const playerN = this.remote ? this.remote.you + 1 : 1;
    const pad0 = this.game.input.gamepads.connected().length;
    drawText(ctx, `Jugador ${playerN} · ${isChar ? 'pulsa uno para elegirlo' : 'pulsa una para equiparla'}${pad0 ? ' · LB/RB: cambiar pestaña' : this.game.input.usingTouch ? '' : ' · TAB: cambiar pestaña'}`, w / 2, y + 56 * s, { size: 12 * s, weight: '600', align: 'center', alpha: 0.7 });

    const header = 74 * s;
    const descH = (isChar ? 150 : 104) * s;
    const footer = 56 * s;
    const pad = 14 * s;
    const gap = 10 * s;
    const areaH = ph - header - descH - footer;
    const tw = (pw - pad * 2 - gap * (cols - 1)) / cols;
    const th = Math.min((areaH - gap * (rows - 1)) / rows, tw * 0.8);
    const gy = y + header + (areaH - (th * rows + gap * (rows - 1))) / 2;
    const tiles = [];
    const myColor = this.slotColor(this.remote ? this.remote.you : 0);
    C.ids.forEach((id, i) => {
      const def = C.defs[id];
      const col = isChar ? def.accent : def.color;
      const tx = x + pad + (i % cols) * (tw + gap);
      const ty = gy + Math.floor(i / cols) * (th + gap);
      const r = { x: tx, y: ty, w: tw, h: th };
      tiles.push(r);
      const sel = id === current;
      const locked = isChar && !isUnlocked(id);
      const pop = sel ? 1 + 0.08 * Math.max(0, 1 - (this.t - this.equipT) / 0.25) : 1;
      ctx.save();
      ctx.translate(tx + tw / 2, ty + th / 2);
      ctx.scale(pop, pop);
      ctx.fillStyle = sel ? withAlpha(col, 0.35) : 'rgba(255,255,255,0.07)';
      pathRoundRect(ctx, -tw / 2, -th / 2, tw, th, 14 * s);
      ctx.fill();
      ctx.lineWidth = (sel ? 4 : 2) * s;
      ctx.strokeStyle = sel ? '#ffd23d' : withAlpha(col, 0.6);
      ctx.stroke();
      ctx.restore();
      if (isChar) {
        const ar = Math.min(th * 0.2, 24 * s);
        ctx.save();
        if (locked) ctx.globalAlpha = 0.35;
        drawAvatar(ctx, tx + tw / 2, ty + th * 0.4, ar, locked ? '#5b6390' : myColor, sel && !locked ? this.t * 1.5 : -0.4, { shape: def.shape, accent: def.accent, halo: sel && !locked });
        ctx.restore();
        if (locked) drawText(ctx, `🔒 ${def.unlock >= 1000 ? `${def.unlock / 1000}k` : def.unlock}`, tx + tw / 2, ty + th * 0.44, { size: Math.min(13 * s, tw / 6), weight: '900', align: 'center', baseline: 'middle', color: '#ffd23d' });
      } else {
        drawText(ctx, def.icon, tx + tw / 2, ty + th * 0.4, { size: Math.min(th * 0.42, 40 * s), align: 'center', baseline: 'middle' });
      }
      drawText(ctx, def.name, tx + tw / 2, ty + th * 0.78, { size: 14 * s, weight: '900', align: 'center', baseline: 'middle' });
      if (sel && !locked) drawText(ctx, isChar ? '✓ ELEGIDO' : '✓ EQUIPADA', tx + 8 * s, ty + 8 * s, { size: 10 * s, weight: '900', color: '#ffd23d' });
      else if (isChar) drawText(ctx, def.role.toUpperCase(), tx + 8 * s, ty + 8 * s, { size: 9 * s, weight: '900', color: def.accent, alpha: 0.9 });
    });

    // Ficha del elegido
    const def = C.defs[current];
    const dy = y + ph - footer - descH + 6 * s;
    const dw = pw - pad * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    pathRoundRect(ctx, x + pad, dy, dw, descH - 12 * s, 12 * s);
    ctx.fill();
    if (isChar) {
      drawText(ctx, `${def.icon} ${def.name}`, x + pad + 12 * s, dy + 10 * s, { size: 16 * s, weight: '900', color: def.accent });
      const lockedDesc = !isUnlocked(current);
      drawText(ctx, lockedDesc ? `🔒 ${def.unlock} 🏆 · tienes ${PROGRESS.trophies}` : def.role.toUpperCase(), x + pw - pad - 12 * s, dy + 12 * s, { size: 12 * s, weight: '900', align: 'right', color: lockedDesc ? '#ffd23d' : def.accent });
      drawWrapped(ctx, def.desc, x + pad + 12 * s, dy + 34 * s, dw - 24 * s, { size: 12.5 * s, weight: '500', lineHeight: 16 * s });
      const bars = characterBars(def);
      const bw = (dw - 24 * s - 3 * 10 * s) / 4;
      bars.forEach(([label, v], i) => {
        const bx = x + pad + 12 * s + i * (bw + 10 * s);
        const by = dy + descH - 44 * s;
        drawText(ctx, label, bx, by, { size: 9 * s, weight: '900', alpha: 0.7 });
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        pathRoundRect(ctx, bx, by + 13 * s, bw, 8 * s, 4 * s);
        ctx.fill();
        ctx.fillStyle = def.accent;
        pathRoundRect(ctx, bx, by + 13 * s, Math.max(6 * s, bw * Math.max(0.05, v)), 8 * s, 4 * s);
        ctx.fill();
      });
    } else {
      drawText(ctx, `${def.icon} ${def.name}`, x + pad + 12 * s, dy + 10 * s, { size: 16 * s, weight: '900', color: def.color });
      const cd = Math.round(def.cooldown * (CHARACTERS[slot?.character]?.stats.ability ?? 1));
      drawText(ctx, `Recarga: ${cd} s`, x + pw - pad - 12 * s, dy + 12 * s, { size: 12 * s, weight: '700', align: 'right', alpha: 0.75 });
      drawWrapped(ctx, def.description, x + pad + 12 * s, dy + 34 * s, dw - 24 * s, { size: 13 * s, weight: '500', lineHeight: 17 * s });
    }

    const ok = { x: w / 2 - 80 * s, y: y + ph - footer + 6 * s, w: 160 * s, h: 40 * s };
    this.drawButton(ctx, ok, 'LISTO', '#ffc727', '#b8860b', '#2a1a00', s, 1, 17);
    this.AP = { box: { x, y, w: pw, h: ph }, tiles, tabs, ok, cols };
  }

  /** Panel INVITAR: online (crear / unirse / código) + jugar en el mismo dispositivo. */
  drawPanel(ctx, w, h, s) {
    const net = this.game.net;
    const avail = net.availability;
    ctx.fillStyle = 'rgba(3,5,25,0.7)';
    ctx.fillRect(0, 0, w, h);
    const pw = Math.min(w - 24 * s, 560 * s);
    const ph = Math.min(h - 24 * s, (net.isHost ? 470 : 400) * s);
    const x = (w - pw) / 2;
    const y = (h - ph) / 2;
    const P = (this.P = { box: { x, y, w: pw, h: ph } });
    ctx.fillStyle = '#16207a';
    pathRoundRect(ctx, x, y, pw, ph, 20 * s);
    ctx.fill();
    ctx.lineWidth = 3 * s;
    ctx.strokeStyle = '#3dd1ff';
    ctx.stroke();

    const ix = x + 22 * s;
    const iw = pw - 44 * s;
    let cy = y + 18 * s;
    drawText(ctx, 'INVITAR AMIGOS', w / 2, cy, { size: 24 * s, weight: '900', align: 'center', stroke: '#0b0e3a', strokeWidth: 6 * s });
    cy += 44 * s;

    // ── Online ──
    drawText(ctx, '🌐 ONLINE (cada uno en su casa)', ix, cy, { size: 15 * s, weight: '900', color: '#ffd23d' });
    cy += 26 * s;
    const bh = 52 * s;
    if (!avail.ok) {
      cy += drawWrapped(ctx, avail.reason, ix, cy, iw, { size: 14 * s, weight: '700', color: '#ff9db0' });
    } else if (net.isHost) {
      drawText(ctx, 'Código de la sala:', ix, cy, { size: 13 * s, weight: '600', alpha: 0.8 });
      drawText(ctx, net.code, x + pw / 2, cy + 14 * s, { size: 40 * s, weight: '900', align: 'center', color: '#ffffff', stroke: '#0b0e3a', strokeWidth: 7 * s });
      cy += 62 * s;
      const link = net.inviteUrl;
      drawText(ctx, link ? 'Envía el enlace: tus amigos entran directamente a tu sala.' : 'Pásales el código: abren el juego → UNIRSE A SALA.', ix, cy, { size: 12 * s, weight: '600', alpha: 0.8 });
      cy += 22 * s;
      const bw3 = (iw - 16 * s) / 3;
      const bh3 = 46 * s;
      P.share = { x: ix, y: cy, w: bw3, h: bh3 };
      P.whatsapp = { x: ix + bw3 + 8 * s, y: cy, w: bw3, h: bh3 };
      P.copy = { x: ix + (bw3 + 8 * s) * 2, y: cy, w: bw3, h: bh3 };
      this.drawButton(ctx, P.share, '📤 COMPARTIR', '#3dd1ff', '#1b7fa8', '#06263a', s, 1, 15);
      this.drawButton(ctx, P.whatsapp, '💬 WHATSAPP', '#3dff9a', '#1f9a5a', '#06311a', s, 1, 15);
      this.drawButton(ctx, P.copy, link ? '📋 COPIAR' : '📋 CÓDIGO', '#c79bff', '#7a4fc0', '#21093f', s, 1, 15);
      cy += bh3 + 14 * s;
      P.closeRoom = { x: x + pw / 2 - 80 * s, y: cy, w: 160 * s, h: 36 * s };
      this.drawButton(ctx, P.closeRoom, 'Cerrar sala', '#ff6b8a', '#a8304b', '#3a0612', s, 1, 14);
      cy += 46 * s;
      drawText(ctx, net.connectionInfo, x + pw / 2, cy, { size: 11 * s, weight: '600', align: 'center', alpha: 0.55 });
      cy += 14 * s;
    } else {
      const bw = (iw - 12 * s) / 2;
      P.create = { x: ix, y: cy, w: bw, h: bh };
      P.join = { x: ix + bw + 12 * s, y: cy, w: bw, h: bh };
      const busy = net.busy;
      this.drawButton(ctx, P.create, busy ? '…' : 'CREAR SALA', '#3dff9a', '#1f9a5a', '#06311a', s, 1, 17);
      this.drawButton(ctx, P.join, 'UNIRSE', '#ffc727', '#b8860b', '#2a1a00', s, 1, 17);
      cy += bh + 14 * s;
      const keys = this.slots[0]?.device === 'kbm' ? 'C: crear  ·  U: unirse' : 'Crear: X en el mando · Unirse: necesita teclado';
      drawText(ctx, keys, x + pw / 2, cy, { size: 11 * s, weight: '600', align: 'center', alpha: 0.55 });
      cy += 24 * s;
    }

    // ── Mismo dispositivo ──
    cy += 6 * s;
    drawText(ctx, '🎮 EN ESTE DISPOSITIVO', ix, cy, { size: 15 * s, weight: '900', color: '#3dff9a' });
    cy += 24 * s;
    drawWrapped(ctx, 'Conecta más mandos (USB o Bluetooth) y pulsa A en cada uno.', ix, cy, iw, { size: 13 * s, weight: '500' });

    P.ok = { x: x + pw / 2 - 70 * s, y: y + ph - 54 * s, w: 140 * s, h: 40 * s };
    this.drawButton(ctx, P.ok, 'CERRAR', '#9aa3c7', '#5b6390', '#1b1f3a', s, 1, 15);
  }
}

    const top = 70 * s;
    const gap = 12 * s;
    const cw = Math.min(300 * s, (w - 24 * s - gap * (cols - 1)) / cols);
    const ch = Math.min(170 * s, (h - top - 30 * s - gap * (rows - 1)) / rows);
    const x0 = (w - (cw * cols + gap * (cols - 1))) / 2;
    MODE_IDS.forEach((id, i) => {
      const m = MODES[id];
      const r = { x: x0 + (i % cols) * (cw + gap), y: top + Math.floor(i / cols) * (ch + gap), w: cw, h: ch };
      this.rects[i] = r;
      const sel = i === this.sel;
      const col = m.pvp ? '#ff4df0' : '#3dd1ff';
      ctx.fillStyle = sel ? withAlpha(col, 0.28) : 'rgba(5,8,40,0.6)';
      pathRoundRect(ctx, r.x, r.y, r.w, r.h, 14 * s);
      ctx.fill();
      ctx.lineWidth = (sel ? 3 : 1.5) * s;
      ctx.strokeStyle = sel ? '#ffffff' : withAlpha(col, 0.7);
      ctx.stroke();
      const fs = Math.min(17 * s, ch * 0.13);
      drawText(ctx, `${m.icon} ${m.name.toUpperCase()}`, r.x + 12 * s, r.y + 12 * s, { size: fs, weight: '900' });
      drawText(ctx, m.pvp ? 'JUGADOR CONTRA JUGADOR' : 'COOPERATIVO', r.x + 12 * s, r.y + 16 * s + fs * 1.2, { size: fs * 0.62, weight: '900', color: col });
      drawWrapped(ctx, m.desc, r.x + 12 * s, r.y + 22 * s + fs * 2.1, r.w - 24 * s, { size: fs * 0.78, lineHeight: fs * 0.98, weight: '600', alpha: 0.85 });
    });
    const hint = this.game.input.usingTouch ? 'Toca un modo para elegirlo' : 'Elige con flechas / stick y pulsa Intro / A';
    drawText(ctx, hint, w / 2, h - 10 * s, { size: 11 * s, weight: '600', align: 'center', baseline: 'bottom', alpha: 0.6 });
  }

  // ─── Menú principal ──────────────────────────────────────
  get mainItems() {
    const g = this.game;
    const items = [];
    if (g.pendingJoin) items.push({ id: 'invite', label: `UNIRSE A LA SALA ${g.pendingJoin}`, color: '#3dff9a', ink: '#06311a', sub: 'Te han invitado' });
    items.push(
      { id: 'play', label: 'JUGAR', color: '#ffc727', ink: '#2a1a00', sub: 'Solo o con mandos aquí' },
      { id: 'modes', label: 'MODOS', color: '#ff7ad9', ink: '#3a0630', sub: 'Supervivencia, JcJ, jefes…' },
      { id: 'road', label: `CAMINO DE TROFEOS · ${PROGRESS.trophies} 🏆`, color: '#ffd23d', ink: '#2a1a00', sub: 'Desbloquea personajes' },
      { id: 'characters', label: 'PERSONAJES', color: '#3dff9a', ink: '#06311a', sub: 'Elige con quién jugar' },
      { id: 'friends', label: 'JUGAR CON AMIGOS', color: '#3dd1ff', ink: '#06263a', sub: 'Sala e invitaciones' },
      { id: 'create', label: 'CREAR SALA', color: '#3dd1ff', ink: '#06263a', sub: 'Online con código' },
      { id: 'join', label: 'UNIRSE A SALA', color: '#3dd1ff', ink: '#06263a', sub: 'Escribe el código' },
      { id: 'settings', label: 'AJUSTES', color: '#c79bff', ink: '#21093f', sub: 'Sonido, gráficos, controles' },
      { id: 'tutorial', label: 'TUTORIAL', color: '#c79bff', ink: '#21093f', sub: 'Aprende a jugar' },
    );
    return items;
  }

  updateMain(nav) {
    const items = this.mainItems;
    const cols = this.mainCols || 1;
    if (nav.dy) this.move(nav.dy * cols, items.length);
    if (nav.dx && cols > 1) this.move(nav.dx, items.length);
    let pick = null;
    let src = nav.ok;
    for (const c of nav.clicks) {
      const i = this.rects.findIndex((r) => r && inRect(c, r));
      if (i >= 0) { pick = i; src = c.source; }
    }
    if (pick === null && nav.ok) pick = this.sel;
    if (pick === null) return;
    Sound.play('ui');
    this.activateMain(items[pick].id, src || this.game.input.deviceId);
  }

  activateMain(id, src) {
    const g = this.game;
    const lobby = g.lobby;
    switch (id) {
      case 'invite': {
        const code = g.pendingJoin;
        g.pendingJoin = null;
        try { history.replaceState(null, '', location.pathname + location.search); } catch { /* nada */ }
        g.openLobby(src);
        g.net.join(code);
        break;
      }
      case 'play': g.openLobby(src); break;
      case 'friends': g.openLobby(src); lobby.panel = true; break;
      case 'create':
        g.openLobby(src);
        lobby.panel = true;
        if (g.net.availability.ok && !g.net.active) g.net.host();
        break;
      case 'join':
        g.openLobby(src);
        if (g.net.availability.ok) lobby.openJoinDialog();
        else lobby.panel = true;
        break;
      case 'settings': this.enter('settings'); break;
      case 'road': this.enter('road'); this.roadScroll = null; this.pendingTaps = []; break;
      case 'characters': g.openLobby(src); lobby.pickKind = 'character'; lobby.abilityPanel = true; break;
      case 'modes': this.enter('modes'); this.sel = Math.max(0, MODE_IDS.indexOf(g.lobby.mode)); break;
      case 'tutorial': this.enter('tutorial'); break;
    }
  }

  move(d, n) {
    this.sel = (this.sel + d + n * 10) % n;
    Sound.play('ui');
  }

  // ─── Ajustes ─────────────────────────────────────────────
  updateSettings(nav) {
    if (this.keysMode) return this.updateKeys(nav);
    const rows = SETTING_ROWS;
    if (nav.back) { Sound.play('ui'); return this.enter('menu'); }
    if (nav.dy) this.move(nav.dy, rows.length);
    if (nav.dx) this.changeSetting(rows[this.sel], nav.dx);
    if (nav.ok) this.changeSetting(rows[this.sel], 1, true);
    for (const c of nav.clicks) {
      const i = this.rects.findIndex((r) => r && inRect(c, r));
      if (i < 0) continue;
      this.sel = i;
      const r = this.rects[i];
      const left = r.dec && inRect(c, r.dec);
      this.changeSetting(rows[i], left ? -1 : 1, !left && !(r.inc && inRect(c, r.inc)));
    }
  }

  changeSetting(row, dir, activate = false) {
    const v = SETTINGS[row.id];
    switch (row.type) {
      case 'range': {
        const nv = Math.round(Math.min(row.max, Math.max(row.min, v + dir * row.step)) * 10) / 10;
        setSetting(row.id, nv);
        break;
      }
      case 'choice': {
        let i = row.options.indexOf(v);
        if (i < 0) i = Math.max(0, row.options.findIndex((o) => typeof o === 'number' && Math.abs(o - v) < 0.1));
        setSetting(row.id, row.options[(i + dir + row.options.length) % row.options.length]);
        break;
      }
      case 'bool': setSetting(row.id, !v); break;
      case 'text':
        if (!activate) return;
        this.game.lobby.openTextDialog({
          title: 'TU NOMBRE', sub: 'Así te verán tus amigos', value: SETTINGS.playerName, maxLength: 14, placeholder: 'Tu nombre',
          onSubmit: (txt) => setSetting('playerName', cleanName(txt, '')),
        });
        return;
      case 'link':
        if (!activate && dir < 0) return;
        this.keysMode = true;
        this.sel = 0;
        break;
      case 'action':
        if (!activate) return;
        if (this.t - this.resetArmed > 3) {
          this.resetArmed = this.t;
          this.game.hud.showToast('Pulsa otra vez para restablecer todos los ajustes');
          return;
        }
        for (const [k, def] of Object.entries(DEFAULT_SETTINGS)) {
          if (k !== 'playerName') setSetting(k, typeof def === 'object' ? { ...def } : def);
        }
        this.game.hud.showToast('Ajustes restablecidos');
        break;
    }
    if (row.id === 'buttonScale') this.game.input.resize(this.game.viewW, this.game.viewH);
    Sound.play('ui');
  }

  updateKeys(nav) {
    const n = KEY_ROWS.length + 1;   // + "restablecer"
    if (nav.back) { this.keysMode = false; this.sel = SETTING_ROWS.findIndex((r) => r.id === 'keys'); return; }
    if (nav.dy) this.move(nav.dy, n);
    let pick = nav.ok ? this.sel : null;
    for (const c of nav.clicks) {
      const i = this.rects.findIndex((r) => r && inRect(c, r));
      if (i >= 0) pick = i;
    }
    if (pick === null) return;
    this.sel = pick;
    if (pick === KEY_ROWS.length) {
      setSetting('keys', { ...DEFAULT_KEYS });
      this.game.hud.showToast('Teclas restablecidas');
      return;
    }
    const [action] = KEY_ROWS[pick];
    this.capturing = action;
    this.game.input.keyCapture = (code) => {
      this.capturing = null;
      if (code === 'Escape' && action !== 'pause') return;
      setSetting('keys', { ...SETTINGS.keys, [action]: code });
      Sound.play('ui');
    };
  }

  // ─── Tutorial ────────────────────────────────────────────
  updateTutorial(nav) {
    const n = TUTORIAL.length;
    if (nav.back) { Sound.play('ui'); return this.enter('menu'); }
    let d = nav.dx || (nav.ok ? 1 : 0);
    for (const c of nav.clicks) {
      if (this.prevBtn && inRect(c, this.prevBtn)) d = -1;
      else if (this.nextBtn && inRect(c, this.nextBtn)) d = 1;
    }
    if (!d) return;
    Sound.play('ui');
    if (this.page + d >= n) return this.enter('menu');
    this.page = Math.max(0, this.page + d);
  }

  // ─── Dibujo ──────────────────────────────────────────────
  draw(ctx, w, h, s) {
    this.game.lobby.drawBackground(ctx, w, h);
    this.rects = [];
    this.back = null;
    const st = this.game.state;
    if (st === 'menu') this.drawMain(ctx, w, h, s);
    else if (st === 'settings') (this.keysMode ? this.drawKeys(ctx, w, h, s) : this.drawSettings(ctx, w, h, s));
    else if (st === 'tutorial') this.drawTutorial(ctx, w, h, s);
    else if (st === 'modes') this.drawModes(ctx, w, h, s);
    else if (st === 'road') this.drawRoad(ctx, w, h, s);
  }

  drawBackButton(ctx, s, label = '◀ VOLVER') {
    const r = { x: 14 * s, y: 14 * s, w: 130 * s, h: 40 * s };
    this.game.lobby.drawButton(ctx, r, label, '#9aa3c7', '#5b6390', '#1b1f3a', s, 1, 15);
    this.back = r;
  }

  drawLogo(ctx, cx, cy, s, size = 60) {
    const k = 1 + 0.02 * Math.sin(this.t * 2);
    drawText(ctx, 'NEÓN ARENA', cx, cy, { size: size * s * k, weight: '900', align: 'center', baseline: 'middle', color: '#00e5ff', stroke: '#0b0e3a', strokeWidth: 9 * s });
    const bx = cx + size * s * 3.3;
    ctx.save();
    ctx.translate(bx, cy - size * s * 0.42);
    ctx.rotate(0.18);
    ctx.fillStyle = '#ffc727';
    pathRoundRect(ctx, -26 * s, -15 * s, 52 * s, 30 * s, 8 * s);
    ctx.fill();
    ctx.restore();
    drawText(ctx, '2.1', bx, cy - size * s * 0.42, { size: 18 * s, weight: '900', align: 'center', baseline: 'middle', color: '#2a1a00' });
  }

  drawMain(ctx, w, h, s) {
    const items = this.mainItems;
    if (this.sel >= items.length) this.sel = 0;
    const short = h < 560;
    const logoSize = Math.min(64, (w / s) / 9.5);
    const logoY = short ? 46 * s : h * 0.16;
    this.drawLogo(ctx, w / 2 - logoSize * s * 0.35, logoY, s, logoSize);
    drawText(ctx, 'Sobrevive a las oleadas · solo o con amigos', w / 2, logoY + logoSize * s * 0.62, { size: 15 * s, weight: '700', align: 'center', baseline: 'middle', alpha: 0.85 });

    // Personajes decorativos girando (los 4 colores de jugador)
    const ay = logoY + logoSize * s * 0.62 + (short ? 30 : 56) * s;
    if (!short) {
      CONFIG.colors.players.forEach((c, i) => {
        const x = w / 2 + (i - 1.5) * 70 * s;
        const ch = CHARACTERS[['titan', 'sombra', 'chispa', 'vita'][i]];
        drawAvatar(ctx, x, ay + Math.sin(this.t * 3 + i) * 5 * s, 16 * s, c, this.t * 1.2 + i * 1.6, { shape: ch.shape, accent: ch.accent });
      });
    }

    const cols = short && w > 700 ? 2 : 1;
    this.mainCols = cols;
    const top = (short ? ay : ay + 40 * s);
    const bottom = h - 24 * s;
    const gap = 10 * s;
    const rows = Math.ceil(items.length / cols);
    const bw = Math.min(cols === 2 ? 300 * s : 380 * s, (w - 40 * s - gap * (cols - 1)) / cols);
    const bh = Math.min(56 * s, (bottom - top - gap * (rows - 1)) / rows);
    const x0 = (w - (bw * cols + gap * (cols - 1))) / 2;
    items.forEach((it, i) => {
      const r = { x: x0 + (i % cols) * (bw + gap), y: top + Math.floor(i / cols) * (bh + gap), w: bw, h: bh };
      this.rects[i] = r;
      const sel = i === this.sel;
      this.game.lobby.drawButton(ctx, r, it.label, it.color, withAlpha(it.color, 0.55), it.ink, s, sel ? 1.04 + 0.015 * Math.sin(this.t * 6) : 1, Math.min(22, bh / s * 0.42));
      if (sel) {
        ctx.lineWidth = 3 * s;
        ctx.strokeStyle = '#ffffff';
        pathRoundRect(ctx, r.x - 4 * s, r.y - 4 * s, r.w + 8 * s, r.h + 8 * s, 18 * s);
        ctx.stroke();
      }
    });
    const hint = this.game.input.usingGamepad ? '✚ / stick: elegir · A: aceptar' : this.game.input.usingTouch ? 'Toca una opción' : '↑ ↓: elegir · Intro: aceptar · o haz clic';
    drawText(ctx, hint, w / 2, h - 10 * s, { size: 11 * s, weight: '600', align: 'center', baseline: 'bottom', alpha: 0.6 });
    drawText(ctx, `🏆 ${PROGRESS.trophies}   ⭐ ${this.game.best}`, w - 16 * s, 16 * s, { size: 15 * s, weight: '800', align: 'right', color: '#ffd23d' });
    if (this.game.input.gamepads.blocked) {
      drawText(ctx, '🎮 Esta vista no permite mandos ni online: usa la web del juego o el archivo descargado', w / 2, h - 28 * s, { size: 11 * s, weight: '700', align: 'center', color: '#ffd23d' });
    }
  }

  settingsLayout(w, h, s, n) {
    const top = 70 * s;
    const bottom = h - 16 * s;
    const fit1 = (bottom - top) / n;
    const cols = fit1 < 36 * s && w > 640 ? 2 : 1;
    const perCol = Math.ceil(n / cols);
    const rowH = Math.min(46 * s, (bottom - top) / perCol);
    const cw = Math.min(cols === 2 ? 440 * s : 620 * s, (w - 24 * s - 14 * s * (cols - 1)) / cols);
    const x0 = (w - (cw * cols + 14 * s * (cols - 1))) / 2;
    return { top, rowH, cw, x0, perCol };
  }

  drawSettings(ctx, w, h, s) {
    this.drawBackButton(ctx, s);
    drawText(ctx, 'AJUSTES', w / 2, 34 * s, { size: 26 * s, weight: '900', align: 'center', baseline: 'middle', stroke: '#0b0e3a', strokeWidth: 6 * s });
    const rows = SETTING_ROWS;
    const { top, rowH, cw, x0, perCol } = this.settingsLayout(w, h, s, rows.length);
    rows.forEach((row, i) => {
      const col = Math.floor(i / perCol);
      const r = { x: x0 + col * (cw + 14 * s), y: top + (i % perCol) * rowH, w: cw, h: rowH - 5 * s };
      this.rects[i] = r;
      const sel = i === this.sel;
      ctx.fillStyle = sel ? 'rgba(255,255,255,0.18)' : 'rgba(5,8,40,0.45)';
      pathRoundRect(ctx, r.x, r.y, r.w, r.h, 10 * s);
      ctx.fill();
      if (sel) { ctx.lineWidth = 2 * s; ctx.strokeStyle = '#ffd23d'; ctx.stroke(); }
      const fs = Math.min(15 * s, r.h * 0.42);
      drawText(ctx, row.label, r.x + 12 * s, r.y + r.h / 2, { size: fs, weight: '700', baseline: 'middle' });
      const v = SETTINGS[row.id];
      const rx = r.x + r.w - 10 * s;
      const cy = r.y + r.h / 2;
      if (row.type === 'range' || row.type === 'choice') {
        const label = row.fmt(v);
        const vw = 140 * s;
        r.dec = { x: rx - vw - 4 * s, y: r.y, w: 30 * s, h: r.h };
        r.inc = { x: rx - 30 * s, y: r.y, w: 34 * s, h: r.h };
        drawText(ctx, '◀', r.dec.x + 12 * s, cy, { size: fs, weight: '900', align: 'center', baseline: 'middle', color: '#3dd1ff' });
        drawText(ctx, label, rx - vw / 2 - 2 * s, cy, { size: fs * 0.92, weight: '800', align: 'center', baseline: 'middle', color: '#ffffff' });
        drawText(ctx, '▶', rx - 10 * s, cy, { size: fs, weight: '900', align: 'center', baseline: 'middle', color: '#3dd1ff' });
        if (row.type === 'range') {
          const bw = vw - 60 * s;
          const bx = rx - vw / 2 - bw / 2 - 2 * s;
          ctx.fillStyle = 'rgba(255,255,255,0.15)';
          ctx.fillRect(bx, r.y + r.h - 7 * s, bw, 3 * s);
          ctx.fillStyle = '#3dd1ff';
          ctx.fillRect(bx, r.y + r.h - 7 * s, bw * ((v - row.min) / (row.max - row.min)), 3 * s);
        }
      } else if (row.type === 'bool') {
        const pw = 62 * s;
        const ph = Math.min(26 * s, r.h - 10 * s);
        ctx.fillStyle = v ? '#3dff9a' : 'rgba(255,255,255,0.2)';
        pathRoundRect(ctx, rx - pw, cy - ph / 2, pw, ph, ph / 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        pathCircle(ctx, v ? rx - ph / 2 : rx - pw + ph / 2, cy, ph / 2 - 3 * s);
        ctx.fill();
        drawText(ctx, v ? 'SÍ' : 'NO', rx - pw - 10 * s, cy, { size: fs * 0.85, weight: '900', align: 'right', baseline: 'middle', color: v ? '#3dff9a' : '#ffffff', alpha: 0.9 });
      } else if (row.type === 'text') {
        drawText(ctx, `${SETTINGS.playerName || '(sin nombre)'}  ✏️`, rx, cy, { size: fs, weight: '800', align: 'right', baseline: 'middle', color: '#ffd23d' });
      } else if (row.type === 'link') {
        drawText(ctx, 'Cambiar  ▶', rx, cy, { size: fs, weight: '800', align: 'right', baseline: 'middle', color: '#3dd1ff' });
      } else if (row.type === 'action') {
        const armed = this.t - this.resetArmed < 3;
        drawText(ctx, armed ? '¿Seguro? Pulsa otra vez' : 'Restablecer', rx, cy, { size: fs * 0.9, weight: '800', align: 'right', baseline: 'middle', color: armed ? '#ff4d6d' : '#ff9db0' });
      }
    });
  }

  drawKeys(ctx, w, h, s) {
    this.drawBackButton(ctx, s);
    drawText(ctx, 'TECLAS DEL TECLADO', w / 2, 34 * s, { size: 24 * s, weight: '900', align: 'center', baseline: 'middle', stroke: '#0b0e3a', strokeWidth: 6 * s });
    const n = KEY_ROWS.length + 1;
    const { top, rowH, cw, x0, perCol } = this.settingsLayout(w, h - 30 * s, s, n);
    for (let i = 0; i < n; i++) {
      const col = Math.floor(i / perCol);
      const r = { x: x0 + col * (cw + 14 * s), y: top + (i % perCol) * rowH, w: cw, h: rowH - 5 * s };
      this.rects[i] = r;
      const sel = i === this.sel;
      ctx.fillStyle = sel ? 'rgba(255,255,255,0.18)' : 'rgba(5,8,40,0.45)';
      pathRoundRect(ctx, r.x, r.y, r.w, r.h, 10 * s);
      ctx.fill();
      if (sel) { ctx.lineWidth = 2 * s; ctx.strokeStyle = '#ffd23d'; ctx.stroke(); }
      const fs = Math.min(15 * s, r.h * 0.42);
      if (i === KEY_ROWS.length) {
        drawText(ctx, 'Restablecer teclas', r.x + r.w / 2, r.y + r.h / 2, { size: fs, weight: '800', align: 'center', baseline: 'middle', color: '#ff9db0' });
        continue;
      }
      const [action, label] = KEY_ROWS[i];
      drawText(ctx, label, r.x + 12 * s, r.y + r.h / 2, { size: fs, weight: '700', baseline: 'middle' });
      const capturing = this.capturing === action;
      drawText(ctx, capturing ? 'Pulsa una tecla…' : keyName(SETTINGS.keys[action]), r.x + r.w - 14 * s, r.y + r.h / 2, {
        size: fs, weight: '900', align: 'right', baseline: 'middle', color: capturing ? '#ffd23d' : '#3dd1ff', alpha: capturing ? 0.6 + 0.4 * Math.sin(this.t * 8) : 1,
      });
    }
    drawText(ctx, 'Las flechas, Mayús (esquivar) y Q (habilidad) también funcionan siempre. Ratón: apuntar y disparar.', w / 2, h - 18 * s, { size: 11 * s, weight: '600', align: 'center', baseline: 'middle', alpha: 0.65 });
  }

  drawTutorial(ctx, w, h, s) {
    this.drawBackButton(ctx, s, '◀ MENÚ');
    const p = TUTORIAL[this.page];
    drawText(ctx, p.title, w / 2, 34 * s, { size: 24 * s, weight: '900', align: 'center', baseline: 'middle', stroke: '#0b0e3a', strokeWidth: 6 * s });
    const pw = Math.min(w - 24 * s, 820 * s);
    const px = (w - pw) / 2;
    const top = 66 * s;
    const ph = h - top - 74 * s;
    ctx.fillStyle = 'rgba(5,8,40,0.55)';
    pathRoundRect(ctx, px, top, pw, ph, 18 * s);
    ctx.fill();

    let y = top + 18 * s;
    const artH = this.drawTutorialArt(ctx, p.art, px, y, pw, ph * 0.5, s);
    y += artH + 14 * s;
    for (const line of p.text || []) {
      y += drawWrapped(ctx, `• ${line}`, px + 22 * s, y, pw - 44 * s, { size: 14 * s, weight: '600', lineHeight: 19 * s }) + 6 * s;
    }

    // Navegación
    const bw = 150 * s;
    const bh = 44 * s;
    const by = h - bh - 14 * s;
    this.prevBtn = this.page > 0 ? { x: w / 2 - bw - 60 * s, y: by, w: bw, h: bh } : null;
    this.nextBtn = { x: w / 2 + 60 * s, y: by, w: bw, h: bh };
    if (this.prevBtn) this.game.lobby.drawButton(ctx, this.prevBtn, '◀ ANTERIOR', '#9aa3c7', '#5b6390', '#1b1f3a', s, 1, 15);
