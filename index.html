  }

  setMainDevice(id) {
    const main = this.lobby.slots[0];
    if (!main) return;
    main.device = id;
    const p = this.mainPlayer;
    if (p && this.state !== 'lobby') p.controller = this.input.createController(id);
    if (id.startsWith('gp')) {
      this.hud.showToast(`🎮 Jugador 1 ahora juega con el Mando ${Number(id.slice(2)) + 1}`);
      this.input.rumble(id, 0.6, 250);
    } else {
      this.hud.showToast(id === 'touch' ? '📱 Jugador 1 vuelve a los controles táctiles' : '⌨️ Jugador 1 vuelve al teclado y ratón');
    }
    this.input.touchHud = this.state === 'playing' && this.touchActive;
    this.net.broadcastLobby();
  }

  onPadDisconnected(i) {
    const id = `gp${i}`;
    const main = this.lobby.slots[0];
    if (main?.device === id) {
      this.setMainDevice(this.input.fallbackDevice);
      if (this.state === 'playing' && !this.net.isClient) this.setState('paused');   // que no te pillen sin mando
      return;
    }
    // Un amigo local se ha quedado sin mando: sale de la sala
    const slot = this.lobby.slotOf(id);
    if (slot && this.state === 'lobby') this.lobby.leave(slot);
  }

  get touchPlayer() {
    return this.players.find((p) => p.controller.usesTouch?.()) ?? null;
  }

  openLobby(hostDevice) {
    this.lobby.open(hostDevice);
    this.setState('lobby');
    this.net.broadcastLobby();
  }

  /** Online: el anfitrión guarda un evento para enviarlo a los invitados. */
  emit(ev) {
    if (this.net.isHost) this.net.outbox.push(ev);
  }

  togglePause() {
    if (this.state === 'playing') this.setState('paused');
    else if (this.state === 'paused') this.setState('playing');
  }

  /** Empieza partida con los huecos de la sala: [{ device: 'kbm', ability: 'nova' }, ...] */
  startRun(entries, { mode = this.lobby.mode, map = this.lobby.mapId } = {}) {
    entries = entries.map((e) => (typeof e === 'string' ? { device: e } : e));
    this.mode = MODES[mode] ?? MODES[DEFAULT_MODE];
    this.loadMap(map);
    // Huecos libres → bots (JcJ y entrenamiento)
    const want = Math.min(4, this.mode.fill || 0);
    let bi = entries.filter((e) => e.device.startsWith('bot')).length;
    while (entries.length < want) entries.push({ device: `bot:${bi++}`, ability: BotController.randomAbility(), character: BotController.randomCharacter(), name: BotController.nameFor(bi) });
    if (this.mode.maxPlayers) entries = entries.slice(0, this.mode.maxPlayers);
    const devices = entries.map((e) => e.device);
    // Cada jugador queda atado a SU dispositivo (si el Jugador 1 usa mando, solo responde al mando)
    const botLevel = this.mode.bots || 'normal';
    const controllers = devices.map((d) => (d.startsWith('net:') ? this.net.createController(d.slice(4))
      : d.startsWith('bot') ? new BotController(this, botLevel) : this.input.createController(d)));

    this.players.length = 0;
    this.enemies.length = 0;
    this.projectiles.length = 0;
    this.pickups.length = 0;
    this.gadgets.length = 0;
    this.effects.clear();
    this.hud.reset();
    this.score = 0;
    this.kills = 0;
    this.time = 0;
    this.hurtFlash = 0;
    this.newBest = false;
    this.result = null;

    controllers.forEach((c, i) => this.addPlayer(c, entries[i].ability, entries[i].name, entries[i].character, entries[i].aura));
    this.waves.reset();
    this.input.resetTransient();
    const n = this.players.length;
    const m = this.mode;
    if (m.pvp) {
      this.pvp = { timeLeft: m.timeLimit || 0, crateT: 4, teamKills: [0, 0] };
      const human = this.players.find((p) => !p.isBot) ?? this.players[0];
      this.camera.snapTo(human.x, human.y);
      const sub = m.practice ? 'Practica todo lo que quieras · sal desde la pausa'
        : m.teams ? `Equipo ${TEAM_NAMES[0]} contra equipo ${TEAM_NAMES[1]} · ${m.killLimit} bajas para ganar`
          : `${m.killLimit} bajas para ganar`;
      this.hud.showBanner(`${m.icon} ${m.name.toUpperCase()}`, sub, { duration: 2.2 });
    } else {
      this.pvp = null;
      this.camera.snapTo(this.map.width / 2, this.map.height / 2);
      const sub = m.bossRush ? `Derrota a ${m.waves} jefes` : m.waves !== Infinity ? `Supera ${m.waves} oleadas` : n > 1 ? `${n} jugadores · las oleadas serán más duras` : 'Sobrevive todo lo que puedas';
      this.hud.showBanner('¡PREPÁRATE!', `${m.icon} ${m.name} · ${this.map.name}` + (sub ? ` · ${sub}` : ''), { duration: 2 });
    }
    this.setState('playing');

    // Online: los efectos del anfitrión se copian para los invitados
    const sink = this.net.isHost ? this.net.outbox : null;
    this.effects.sink = sink;
    this.camera.sink = sink;
    this.net.broadcastStart();

    if (this.touchActive && !document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    }
  }

  addPlayer(controller, ability, name, character, aura) {
    const i = this.players.length;
    const spawns = this.mode.pvp ? this.map.pvpSpawns : this.map.playerSpawns;
    const spawn = spawns[i % spawns.length];
    const colors = CONFIG.colors.players;
    let color = colors[i % colors.length];
    const team = this.mode.teams ? i % 2 : i;
    if (this.mode.teams) color = TEAM_COLORS[team];
    const p = new Player({ id: i + 1, x: spawn.x, y: spawn.y, color, controller, ability, character, aura });
    p.team = team;
    p.isBot = !!controller.isBot;
    if (p.isBot && this.mode.bots === 'easy') { p.maxHp = Math.round(p.maxHp * 0.7); p.hp = p.maxHp; }
    p.name = name || `Jugador ${i + 1}`;
    this.players.push(p);
    return p;
  }

  // ─── API que usan entidades y sistemas ─────────────────────
  spawnEnemy(type, x, y, mods) {
    const e = new Enemy(type, x, y, mods);
    this.map.resolveCircle(e);
    this.enemies.push(e);
    return e;
  }

  spawnProjectile(opts) {
    const p = new Projectile(opts);
    this.emit(['p', Math.round(p.x), Math.round(p.y), Math.round(p.vx), Math.round(p.vy), p.team === 'player' ? 1 : 0, p.color, p.radius, Math.round(p.life * 100) / 100, p.kind, p.owner?.isPlayer ? p.owner.id : 0]);
    this.projectiles.push(p);
    return p;
  }

  spawnGadget(kind, x, y, opts) {
    const g = new Gadget(kind, x, y, opts);
    this.map.resolveCircle(g);
    this.gadgets.push(g);
    return g;
  }

  spawnPickup(kind, x, y, extra) {
    const k = new Pickup(kind, x, y, extra);
    this.pickups.push(k);
    return k;
  }

  nearestPlayer(x, y) {
    let best = null;
    let bd = Infinity;
    for (const p of this.players) {
      if (!p.alive || p.disconnected) continue;   // sin conexión: los enemigos no le persiguen
      const d = dist2(x, y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  // ─── Eventos del juego ────────────────────────────────────
  onEnemyKilled(e, killer) {
    const pts = Math.round(e.def.score * (1 + (this.waves.wave - 1) * 0.15));
    this.score += pts;
    this.kills++;
    if (killer) {
      killer.kills++;
      killer.score = (killer.score || 0) + pts;
    }
    this.playSound('kill', e.x, e.y);
    this.effects.burst(e.x, e.y, { color: e.def.color, count: 14 + e.radius, speed: 260, life: 0.55, size: 3.5 });
    this.effects.ring(e.x, e.y, e.def.color, e.radius * 3, 0.3);
    this.effects.text(e.x, e.y - e.radius - 6, `+${pts}`, '#ffffff', 14);
    this.camera.addShake(e.def.mass > 2 ? 6 : 1.5);
    if (Math.random() < CONFIG.pickups.healthChance * (e.def.dropMult ?? 1)) this.spawnPickup('health', e.x, e.y);
    else if (!e.def.boss && Math.random() < 0.025 * (e.def.dropMult ?? 1)) this.dropWeapon(e.x, e.y);
    if (e.def.boss) this.onBossKilled(e);
    if (e.def.behavior === 'exploder' && !e.defused) this.explode(e);
  }

  explode(e) {
    if (e.exploded) return;
    e.exploded = true;
    e.dead = true;
    const R = e.def.blastRadius;
    this.effects.ring(e.x, e.y, '#ffef5c', R, 0.45);
    this.effects.burst(e.x, e.y, { color: '#ffb02e', count: 40, speed: 420, life: 0.6, size: 4 });
    this.effects.burst(e.x, e.y, { color: e.def.color, count: 20, speed: 250, life: 0.5, size: 3 });
    this.camera.addShake(10);
    this.playSound('explosion', e.x, e.y);
    for (const p of this.players) {
      if (p.alive && dist2(e.x, e.y, p.x, p.y) < (R + p.radius) ** 2) p.takeDamage(e.damage, this, e.x, e.y);
    }
    for (const o of this.enemies) {
      if (o === e || o.dead || o.spawning) continue;
      if (dist2(e.x, e.y, o.x, o.y) < (R + o.radius) ** 2) {
        const n = normalize(o.x - e.x, o.y - e.y);
        o.takeDamage(e.def.blastEnemyDamage, this, n.x, n.y, 300, null);
      }
    }
  }

  onPlayerHurt(p) {
    this.playSound('hurt', p.x, p.y);
    if (SETTINGS.vibration && p.controller.usesTouch?.()) navigator.vibrate?.(60);
    if (!p.isBot && !p.controller.binding?.startsWith('net:')) this.hurtFlash = 0.35;   // solo si soy yo quien recibe
    this.camera.addShake(9);
    this.input.rumble(p.controller.binding, 0.7, 180);
    this.emit(['h', p.id]);
  }

  onPlayerDied(p, killer = null) {
    this.effects.burst(p.x, p.y, { color: p.color, count: 60, speed: 380, life: 0.9, size: 4 });
    this.effects.ring(p.x, p.y, p.color, 120, 0.6);
    this.camera.addShake(15);
    if (this.mode.pvp) return this.onPvpDeath(p, killer);
    if (!this.players.some((pl) => pl.alive)) {
      this.gameOver();
    } else {
      const msg = `💀 P${p.id} ha caído · vuelve al acabar la oleada`;
      this.hud.showToast(msg);
      this.emit(['T', msg]);
    }
  }

  /** Cooperativo: los caídos vuelven junto a un compañero vivo al superar la oleada. */
  revivePlayers() {
    const alive = this.players.filter((p) => p.alive);
    for (const p of this.players) {
      if (p.alive || p.left || !alive.length) continue;
      const buddy = alive[Math.floor(Math.random() * alive.length)];
      p.x = buddy.x + rand(-40, 40);
      p.y = buddy.y + rand(-40, 40);
      this.map.resolveCircle(p);
      p.alive = true;
      p.hp = Math.round(p.maxHp * 0.5);
      p.invuln = 2;
      p.vx = p.vy = 0;
      this.effects.ring(p.x, p.y, p.color, 80, 0.5);
      this.effects.burst(p.x, p.y, { color: p.color, count: 30, speed: 250, life: 0.6 });
      this.effects.text(p.x, p.y - 30, `¡P${p.id} ha vuelto!`, p.color, 16);
    }
  }

  // ─── JcJ ───────────────────────────────────────────────────
  onPvpDeath(p, killer) {
    p.deaths = (p.deaths || 0) + 1;
    p.respawnT = PVP.respawn;
    let msg;
    if (killer && killer !== p && this.isHostile(killer, p)) {
      killer.pvpKills = (killer.pvpKills || 0) + 1;
      if (this.mode.teams) this.pvp.teamKills[killer.team]++;
      killer.heal(25);
      msg = `⚔️ ${killer.name} ha eliminado a ${p.name}`;
      this.effects.text(killer.x, killer.y - 34, '+1 BAJA', killer.color, 18);
    } else {
      msg = `💀 ${p.name} se ha eliminado solo`;
    }
    this.hud.showToast(msg);
    this.emit(['T', msg]);
    this.checkPvpWin();
  }

  /** Puntuación JcJ por "bando": jugador (todos contra todos) o equipo. */
  pvpStandings() {
    if (this.mode.teams) {
      return [0, 1].map((t) => ({ team: t, name: `EQUIPO ${TEAM_NAMES[t]}`, short: TEAM_NAMES[t], color: TEAM_COLORS[t], kills: this.pvp.teamKills[t] }))
        .sort((a, b) => b.kills - a.kills);
    }
    return this.players.filter((p) => !p.left).map((p) => ({ player: p, name: p.name, color: p.color, kills: p.pvpKills || 0, deaths: p.deaths || 0 }))
      .sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
  }

  checkPvpWin(timeUp = false) {
    const m = this.mode;
    if (!this.pvp || this.state !== 'playing') return;
    const st = this.pvpStandings();
    const top = st[0];
    const reached = m.killLimit && top && top.kills >= m.killLimit;
    if (!reached && !timeUp) return;
    if (timeUp && st[1] && st[1].kills === top.kills) {
      return this.endMatch({ title: '¡EMPATE!', sub: `Se acabó el tiempo con ${top.kills} bajas cada uno`, color: '#ffd23d' });
    }
    this.endMatch({ title: `¡GANA ${top.name.toUpperCase()}!`, sub: `${top.kills} ${top.kills === 1 ? 'baja' : 'bajas'}${timeUp ? ' · se acabó el tiempo' : ''}`, color: top.color, winner: top.player?.id ?? null, team: top.team ?? null });
  }

  endMatch(result) {
    this.result = result;
    this.playSound(result.lost ? 'gameOver' : 'waveClear');
    this.setState('gameover');
    this.onMatchEnd?.(result);
  }

  /** Cada paso en JcJ: reloj, reapariciones y cajas de armas. */
  updatePvp(dt) {
    const pv = this.pvp;
    if (this.mode.timeLimit) {
      pv.timeLeft -= dt;
      if (pv.timeLeft <= 0) {
        pv.timeLeft = 0;
        return this.checkPvpWin(true);
      }
    }
    for (const p of this.players) {
      if (p.alive || p.left || p.disconnected) continue;
      p.respawnT -= dt;
      if (p.respawnT <= 0) this.respawnPvp(p);
    }
    pv.crateT -= dt;
    if (pv.crateT <= 0) {
      pv.crateT = PVP.crateEvery;
      const free = this.map.crates.filter((c) => !this.pickups.some((k) => (k.x - c.x) ** 2 + (k.y - c.y) ** 2 < 60 * 60));
      if (free.length) {
        const c = free[Math.floor(Math.random() * free.length)];
        if (Math.random() < 0.35) this.spawnPickup('health', c.x, c.y);
        else this.dropWeapon(c.x, c.y, randomWeapon(8, ['pistol']));
      }
    }
  }

  /** Reaparecer en el punto más alejado de los rivales, con escudo breve y la pistola. */
  respawnPvp(p) {
    const foes = this.players.filter((q) => q.alive && this.isHostile(q, p));
    let best = this.map.pvpSpawns[0];
    let bd = -1;
    for (const sp of [...this.map.pvpSpawns, ...this.map.playerSpawns]) {
      const d = foes.length ? Math.min(...foes.map((q) => (q.x - sp.x) ** 2 + (q.y - sp.y) ** 2)) : Math.random();
      if (d > bd) { bd = d; best = sp; }
    }
    p.x = best.x;
    p.y = best.y;
    p.vx = p.vy = 0;
    p.alive = true;
    p.hp = p.maxHp;
    p.invuln = PVP.spawnShield;
    p.resetWeapons?.();
    p.revived = false;
    this.effects.ring(p.x, p.y, p.color, 90, 0.5);
    this.effects.burst(p.x, p.y, { color: p.color, count: 30, speed: 260, life: 0.6 });
  }

  /** Cooperativo con final (20 oleadas, 6 jefes): ¡victoria! */
  victory() {
    const m = this.mode;
    this.saveBestIfNeeded();
    this.endMatch({ title: '¡VICTORIA!', sub: m.bossRush ? `Habéis derrotado a los ${m.waves} jefes` : `Habéis superado las ${m.waves} oleadas`, color: '#3dff9a', win: true });
  }

  saveBestIfNeeded() {
    if (this.mode.pvp) return;
    if (this.score > this.best) {
      this.best = this.score;
      this.newBest = true;
      saveBest(this.best);
    }
  }

  gameOver() {
    this.result = { title: this.players.length > 1 ? 'OS HAN DERROTADO' : 'HAS CAÍDO', color: CONFIG.colors.danger, lost: true };
    this.onMatchEnd?.(this.result);
    this.setState('gameover');
    if (this.score > this.best) {
      this.best = this.score;
      this.newBest = true;
      saveBest(this.best);
    }
  }

  onWaveStart(n, wave) {
    if (wave.boss) {
      const def = ENEMY_TYPES[wave.boss];
      const title = def.boss === 'final' ? '⚠ JEFE FINAL ⚠' : '⚠ MINIJEFE ⚠';
      this.hud.showBanner(title, `OLEADA ${n} · ${def.name}`, { color: '#ff4df0', duration: 3 });
      this.emit(['B', title, `OLEADA ${n} · ${def.name}`, { color: '#ff4df0', duration: 3 }]);
      this.playSound('warning');
      SoundEngine.startMusic('boss');
      return;
    }
    const names = wave.introduced.filter(() => n > 1).map((k) => ENEMY_TYPES[k].name);
    const sub = names.length ? `Nuevo enemigo: ${names.join(', ')}` : n === 1 ? '¡Que no te toquen!' : '';
    this.hud.showBanner(`OLEADA ${n}`, sub);
    this.emit(['B', `OLEADA ${n}`, sub, {}]);
    this.playSound('waveStart');
  }

  onBossKilled(e) {
    const final = e.def.boss === 'final';
    this.camera.addShake(20);
    this.effects.burst(e.x, e.y, { color: e.def.color, count: 120, speed: 520, life: 1.2, size: 5 });
    this.effects.ring(e.x, e.y, '#ffffff', 320, 0.8);
    this.playSound('bigExplosion', e.x, e.y);
    const title = final ? '¡NÚCLEO OMEGA DESTRUIDO!' : '¡COLOSO DERROTADO!';
    const sub = final ? 'Ha soltado el arma legendaria NOVA PRIME 👑' : 'Ha soltado un arma poderosa';
    this.hud.showBanner(title, sub, { color: '#ffd700', duration: 3 });
    this.emit(['B', title, sub, { color: '#ffd700', duration: 3 }]);
    this.dropWeapon(e.x, e.y, final ? 'legendary' : randomWeapon(this.waves.wave + 10, ['smg', 'pistol', 'shotgun']));
    this.spawnPickup('health', e.x + 40, e.y);
    this.spawnPickup('health', e.x - 40, e.y);
    SoundEngine.startMusic('game');
  }

  onWaveCleared(n) {
    const bonus = CONFIG.waves.clearBonus * n;
    this.score += bonus;
    if (n >= this.mode.waves) return this.victory();
    for (const p of this.players) if (p.alive) p.heal(CONFIG.waves.clearHeal);
    this.revivePlayers();
    this.playSound('waveClear');
    // Caja de arma por jugador cerca de cada superviviente
    for (const p of this.players) {
      if (!p.alive || p.left) continue;
      const a = Math.random() * Math.PI * 2;
      const x = p.x + Math.cos(a) * 90;
      const y = p.y + Math.sin(a) * 90;
      if (!this.map.circleBlocked(x, y, 20)) this.dropWeapon(x, y);
      else this.dropWeapon(p.x, p.y + 60);
    }
    const sub = `+${bonus} puntos  ·  +${CONFIG.waves.clearHeal} vida`;
    this.hud.showBanner('¡OLEADA SUPERADA!', sub, { color: '#3dff9a' });
    this.emit(['B', '¡OLEADA SUPERADA!', sub, { color: '#3dff9a' }]);
  }

  // ─── Online: lado del INVITADO ────────────────────────────
  /** El anfitrión ha pulsado JUGAR: crear copias de los jugadores. */
  startClient(msg) {
    this.mode = MODES[msg.mode] ?? MODES[DEFAULT_MODE];
    this.loadMap(msg.map);
    this.pvp = this.mode.pvp ? { timeLeft: this.mode.timeLimit || 0, crateT: 0, teamKills: [0, 0] } : null;
    this.result = null;
    this.players.length = 0;
    this.enemies = [];
    this.projectiles.length = 0;
    this.pickups = [];
    this.gadgets = [];
    this.effects.clear();
    this.effects.sink = null;
    this.camera.sink = null;
    this.hud.reset();
    this.score = 0;
    this.kills = 0;
    this.waves.reset();
    const remote = { binding: 'remote', usesTouch: () => false, read: () => null };
    for (const pd of msg.players) {
      const mine = pd.id === msg.you;
      const p = new Player({
        id: pd.id, x: this.map.width / 2, y: this.map.height / 2, color: pd.color, ability: pd.ability, character: pd.character, aura: pd.aura,
        controller: mine ? this.input.createController(this.lobby.slots[0]?.device || this.input.fallbackDevice) : remote,
      });
      p.name = pd.name || `Jugador ${pd.id}`;
      p.team = pd.team ?? 0;
      p.isBot = !!pd.bot;
      this.players.push(p);
      if (mine) this.me = p;
    }
    this.camera.snapTo(this.me?.x ?? this.map.width / 2, this.me?.y ?? this.map.height / 2);
    this.input.resetTransient();
    if (!msg.resume) this.hud.showBanner('¡PREPÁRATE!', `Partida online · eres ${this.me?.name ?? `el Jugador ${msg.you}`}`, { duration: 1.8 });
    this.setState('playing');
  }

  /** El invitado sale de la sala online (o se corta): vuelve a su sala local. */
  leaveOnline() {
    this.me = null;
    this.players.length = 0;
    this.enemies = [];
    this.pickups = [];
    this.gadgets = [];
    this.projectiles.length = 0;
    this.lobby.clearRemote();
    this.lobby.open(this.input.deviceId);
    this.setState('lobby');
  }

  /** El invitado no simula: suaviza lo que llega del anfitrión y mueve balas/efectos. */
  updateClient(dt) {
    if (this.state === 'playing') {
      const k = Math.min(1, dt * 15);
      for (const p of this.players) {
        if (p.tx === undefined) continue;
        p.x += (p.tx - p.x) * k;
        p.y += (p.ty - p.y) * k;
        p.invuln = Math.max(0, p.invuln - dt);
